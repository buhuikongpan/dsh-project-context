# dsh-project-context — bundle activation row (profile layer).
#
# 包名/仓库名是历史标识（dsh-project-context），它现在实现的是「临时会话」：
# 每个临时会话在自己的子目录里工作并被钉在 workspace-write（可写边界 = 它自己的
# cwd），项目工作区照旧注入 <project_context>，临时会话不注入任何提示词。
#
# 这一行是 profile 层的一条激活记录，id 必须保持稳定：重新 add / profile patch
# 都靠它定位。不要同时在 ~/.dsh/profiles/web/cordis.patch.yml 里手写一条同样的
# insert 行 —— 会造成重复加载。
- insert:
    - id: project-context
      name: 'dsh-project-context'
